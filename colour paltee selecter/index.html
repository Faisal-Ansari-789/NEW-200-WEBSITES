<!DOCTYPE html>
<html>
<head>
  <title>Colour Palette</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; margin-bottom: 10px; }
    p { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }
    .container { max-width: 800px; margin: auto; }
    h2 { color: #555; font-size: 16px; margin-bottom: 15px; }
    .palette { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
    .swatch { border-radius: 8px; padding: 40px 20px 12px; text-align: center; font-size: 11px; color: white; min-width: 80px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .dark { color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Colour Palette</h1>
    <p>Some of my favourite colour combinations for web design</p>
    <h2>Ocean Blues</h2>
    <div class="palette">
      <div class="swatch" style="background:#1a73e8">#1a73e8</div>
      <div class="swatch" style="background:#4a90e2">#4a90e2</div>
      <div class="swatch" style="background:#74b9ff">#74b9ff</div>
      <div class="swatch" style="background:#a8d8ff" class="dark">#a8d8ff</div>
      <div class="swatch" style="background:#d0eaff;color:#333">#d0eaff</div>
    </div>
    <h2>Warm Earthy</h2>
    <div class="palette">
      <div class="swatch" style="background:#c0392b">#c0392b</div>
      <div class="swatch" style="background:#e8a060">#e8a060</div>
      <div class="swatch" style="background:#f39c12">#f39c12</div>
      <div class="swatch" style="background:#f5cba7;color:#333">#f5cba7</div>
      <div class="swatch" style="background:#fef9f0;color:#333">#fef9f0</div>
    </div>
    <h2>Dark Mode</h2>
    <div class="palette">
      <div class="swatch" style="background:#0d0d0d">#0d0d0d</div>
      <div class="swatch" style="background:#1a1a2e">#1a1a2e</div>
      <div class="swatch" style="background:#16213e">#16213e</div>
      <div class="swatch" style="background:#0f3460">#0f3460</div>
      <div class="swatch" style="background:#00d4ff">#00d4ff</div>
    </div>
  </div>
</body>
</html>
