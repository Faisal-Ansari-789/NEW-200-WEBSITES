<!DOCTYPE html>
<html>
<head>
  <title>Sweet Bakes Bakery</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; padding: 0; }
    header { background: #c0392b; color: white; text-align: center; padding: 30px 20px; }
    header h1 { font-size: 30px; margin-bottom: 6px; }
    header p { font-size: 13px; color: #ffd5d5; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 6px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
    .card { background: white; border: 1px solid #f0d9c8; border-radius: 8px; padding: 16px; text-align: center; }
    .card h3 { font-size: 30px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #555; margin-bottom: 6px; }
    .card .price { color: #c0392b; font-weight: bold; font-size: 15px; }
    footer { background: #c0392b; color: white; text-align: center; padding: 15px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🍰 Sweet Bakes Bakery</h1>
    <p>Freshly baked with love every day | Aurangabad, Maharashtra</p>
  </header>
  <div class="container">
    <h2>Our Specialities</h2>
    <div class="grid">
      <div class="card"><h3>🎂</h3><p>Birthday Cake</p><p class="price">₹599</p></div>
      <div class="card"><h3>🧁</h3><p>Cupcakes (6 pcs)</p><p class="price">₹249</p></div>
      <div class="card"><h3>🍞</h3><p>Fresh Bread</p><p class="price">₹49</p></div>
      <div class="card"><h3>🥐</h3><p>Croissant</p><p class="price">₹79</p></div>
      <div class="card"><h3>🍪</h3><p>Cookies (12 pcs)</p><p class="price">₹199</p></div>
      <div class="card"><h3>🥧</h3><p>Fruit Tart</p><p class="price">₹149</p></div>
    </div>
  </div>
  <footer>📍 Near Railway Station, Aurangabad | 📞 Call us: 7276524259</footer>
</body>
</html>
