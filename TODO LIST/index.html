<!DOCTYPE html>
<html>
<head>
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="col" data-col="todo">

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
