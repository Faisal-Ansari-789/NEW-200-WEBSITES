<!DOCTYPE html>
<html>
<head>
  <title>May 2026 Calendar</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .calendar { background: white; border-radius: 10px; border: 1px solid #ddd; padding: 20px; max-width: 420px; width: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h2 { color: #2c3e50; font-size: 18px; }
    .header button { background: #2c3e50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .days-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: bold; color: #aaa; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { text-align: center; padding: 8px 4px; font-size: 13px; color: #444; border-radius: 4px; cursor: pointer; }
    .day:hover { background: #f0f0f0; }
    .today { background: #2c3e50; color: white; border-radius: 4px; }
    .today:hover { background: #2c3e50; }
    .empty { color: #ddd; }
    .sunday { color: #c0392b; }
  </style>
</head>
<body>
  <div class="calendar">
    <div class="header">
      <button>← Prev</button>
      <h2>May 2026</h2>
      <button>Next →</button>
    </div>
    <div class="days-header">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid">
      <div class="day empty"></div><div class="day empty"></div><div class="day empty"></div><div class="day empty"></div><div class="day empty"></div><div class="day">1</div><div class="day">2</div>
      <div class="day sunday">3</div><div class="day">4</div><div class="day">5</div><div class="day">6</div><div class="day">7</div><div class="day">8</div><div class="day">9</div>
      <div class="day sunday">10</div><div class="day today">11</div><div class="day">12</div><div class="day">13</div><div class="day">14</div><div class="day">15</div><div class="day">16</div>
      <div class="day sunday">17</div><div class="day">18</div><div class="day">19</div><div class="day">20</div><div class="day">21</div><div class="day">22</div><div class="day">23</div>
      <div class="day sunday">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div><div class="day">30</div>
      <div class="day sunday">31</div>
    </div>
  </div>
</body>
</html>
