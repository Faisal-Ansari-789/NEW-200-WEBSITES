<!DOCTYPE html>
<html>
<head>
  <title>Quote of the Day</title>
  <style>
    body { font-family: Georgia, serif; background: #1a1a2e; color: white; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 22px; color: #aaa; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase; }
    .quote-card { background: #16213e; border-left: 5px solid #e8a060; border-radius: 8px; padding: 30px 40px; max-width: 600px; margin-bottom: 20px; }
    .quote-text { font-size: 18px; line-height: 1.8; color: #f0f0f0; font-style: italic; margin-bottom: 15px; }
    .quote-author { font-size: 14px; color: #e8a060; text-align: right; }
    .divider { color: #444; margin: 10px 0; text-align: center; font-size: 20px; }
  </style>
</head>
<body>
  <h1>✨ Quote of the Day</h1>
  <div class="quote-card">
    <div class="quote-text">"The only way to do great work is to love what you do."</div>
    <div class="quote-author">— Steve Jobs</div>
  </div>
  <div class="divider">❧</div>
  <div class="quote-card">
    <div class="quote-text">"It does not matter how slowly you go as long as you do not stop."</div>
    <div class="quote-author">— Confucius</div>
  </div>
  <div class="divider">❧</div>
  <div class="quote-card">
    <div class="quote-text">"Code is like humor. When you have to explain it, it's bad."</div>
    <div class="quote-author">— Cory House</div>
  </div>
</body>
</html>
