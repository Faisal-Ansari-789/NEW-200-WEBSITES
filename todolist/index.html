<!DOCTYPE html>
<html>
<head>
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 40px auto; }
    h1 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
    .task { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; }
    .task input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .task label { font-size: 14px; color: #444; cursor: pointer; }
    .done label { text-decoration: line-through; color: #aaa; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; white-space: nowrap; }
    .urgent { background: #fde8e8; color: #c0392b; }
    .normal { background: #e8f4fd; color: #2980b9; }
    .done-tag { background: #e8f8e8; color: #27ae60; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✅ My To-Do List</h1>
    <div class="task">
      <input type="checkbox" id="t1">
      <label for="t1">Complete portfolio website</label>
      <span class="tag urgent">Urgent</span>
    </div>
    <div class="task">
      <input type="checkbox" id="t2">
      <label for="t2">Upload files to GitHub</label>
      <span class="tag urgent">Urgent</span>
    </div>
    <div class="task">
      <input type="checkbox" id="t3">
      <label for="t3">Study Data Science chapter 4</label>
      <span class="tag normal">Normal</span>
    </div>
    <div class="task">
      <input type="checkbox" id="t4">
      <label for="t4">Make 5 more HTML pages today</label>
      <span class="tag normal">Normal</span>
    </div>
    <div class="task done">
      <input type="checkbox" id="t5" checked>
      <label for="t5">Connect GitHub to Vercel</label>
      <span class="tag done-tag">Done</span>
    </div>
    <div class="task done">
      <input type="checkbox" id="t6" checked>
      <label for="t6">Create portfolio page</label>
      <span class="tag done-tag">Done</span>
    </div>
  </div>
</body>
</html>
