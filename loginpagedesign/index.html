<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 40px; width: 100%; max-width: 380px; }
    h1 { text-align: center; color: #2c3e50; font-size: 22px; margin-bottom: 6px; }
    p { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 25px; }
    label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; text-transform: uppercase; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 16px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #2c3e50; }
    button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1a252f; }
    .forgot { text-align: center; font-size: 12px; color: #2980b9; margin-top: 15px; cursor: pointer; }
    .signup { text-align: center; font-size: 13px; color: #777; margin-top: 20px; }
    .signup a { color: #2980b9; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Welcome Back</h1>
    <p>Login to your account</p>
    <label>Email Address</label>
    <input type="email" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" placeholder="••••••••" />
    <button>Login</button>
    <p class="forgot">Forgot password?</p>
    <p class="signup">Don't have an account? <a href="#">Sign Up</a></p>
  </div>
</body>
</html>
