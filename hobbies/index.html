<!DOCTYPE html>
<html>
<head>
  <title>My Hobbies</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 800px; margin: auto; }
    .box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; text-align: center; }
    .box h2 { font-size: 40px; margin-bottom: 10px; }
    .box p { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>My Hobbies</h1>
  <div class="grid">
    <div class="box"><h2>🏏</h2><p>Cricket</p></div>
    <div class="box"><h2>🎵</h2><p>Listening to Music</p></div>
    <div class="box"><h2>💻</h2><p>Coding</p></div>
    <div class="box"><h2>📚</h2><p>Reading</p></div>
    <div class="box"><h2>🎮</h2><p>Gaming</p></div>
    <div class="box"><h2>🌍</h2><p>Exploring</p></div>
  </div>
</body>
</html>
