<!DOCTYPE html>
<html>
<head>
  <title>Wedding Invitation</title>
  <style>
    body { font-family: Georgia, serif; background: #fff8f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border: 3px double #c8a96e; border-radius: 12px; padding: 40px; max-width: 480px; width: 100%; text-align: center; }
    .top { font-size: 13px; letter-spacing: 3px; color: #c8a96e; text-transform: uppercase; margin-bottom: 15px; }
    h1 { font-size: 36px; color: #2c1810; margin-bottom: 5px; }
    .and { font-size: 20px; color: #c8a96e; margin: 5px 0; }
    .divider { border: none; border-top: 1px solid #c8a96e; margin: 20px 0; }
    p { font-size: 14px; color: #555; line-height: 1.8; }
    .detail { margin: 20px 0; }
    .detail h2 { font-size: 22px; color: #2c1810; margin-bottom: 5px; }
    .detail p { font-size: 13px; color: #777; }
    .emoji { font-size: 40px; margin: 15px 0; }
    .footer-note { font-size: 12px; color: #c8a96e; font-style: italic; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">Together with their families</div>
    <div class="emoji">💍</div>
    <h1>Ahmed</h1>
    <div class="and">&</div>
    <h1>Ayesha</h1>
    <hr class="divider">
    <p>Joyfully invite you to celebrate their wedding</p>
    <div class="detail">
      <h2>Saturday, July 12, 2026</h2>
      <p>Nikah: 11:00 AM | Reception: 7:00 PM</p>
    </div>
    <hr class="divider">
    <p>📍 Al-Noor Banquet Hall<br>Near Railway Station, Aurangabad, Maharashtra</p>
    <p class="footer-note">Your presence will make our day extra special 🌸</p>
  </div>
</body>
</html>
