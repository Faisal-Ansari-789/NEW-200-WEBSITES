<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday!</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff0f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border: 2px solid #ffb6c1; border-radius: 12px; padding: 40px; text-align: center; max-width: 500px; }
    h1 { color: #e91e8c; font-size: 36px; }
    p { color: #555; line-height: 1.8; margin-top: 15px; }
    .emoji { font-size: 60px; margin: 20px 0; }
    .name { color: #e91e8c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎂🎉🎈</div>
    <h1>Happy Birthday!</h1>
    <p>Wishing <span class="name">Ansari Mohammed Faisal</span> a very Happy Birthday! May this year bring you lots of success, happiness and amazing opportunities. Keep coding and keep growing! 🚀</p>
    <p style="margin-top:20px; color:#aaa; font-size:13px;">Made with Love using HTML & CSS</p>
  </div>
</body>
</html>
