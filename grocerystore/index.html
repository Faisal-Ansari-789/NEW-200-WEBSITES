<!DOCTYPE html>
<html>
<head>
  <title>Fresh Mart Grocery</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5fff5; margin: 0; padding: 0; }
    header { background: #27ae60; color: white; text-align: center; padding: 30px 20px; }
    header h1 { font-size: 28px; }
    header p { font-size: 13px; color: #d5f5e3; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 6px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    .card { background: white; border: 1px solid #d5f5e3; border-radius: 8px; padding: 16px; text-align: center; }
    .card h3 { font-size: 28px; }
    .card p { font-size: 13px; color: #555; margin-top: 6px; }
    .card .price { color: #27ae60; font-weight: bold; }
    footer { background: #27ae60; color: white; text-align: center; padding: 15px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Fresh Mart Grocery</h1>
    <p>Fresh. Local. Affordable. | Aurangabad</p>
  </header>
  <div class="container">
    <h2>Today's Items</h2>
    <div class="grid">
      <div class="card"><h3>🍅</h3><p>Tomato</p><p class="price">₹30/kg</p></div>
      <div class="card"><h3>🥔</h3><p>Potato</p><p class="price">₹25/kg</p></div>
      <div class="card"><h3>🧅</h3><p>Onion</p><p class="price">₹40/kg</p></div>
      <div class="card"><h3>🥕</h3><p>Carrot</p><p class="price">₹35/kg</p></div>
      <div class="card"><h3>🍌</h3><p>Banana</p><p class="price">₹20/dz</p></div>
      <div class="card"><h3>🍎</h3><p>Apple</p><p class="price">₹120/kg</p></div>
      <div class="card"><h3>🥛</h3><p>Milk</p><p class="price">₹55/L</p></div>
      <div class="card"><h3>🥚</h3><p>Eggs</p><p class="price">₹80/dz</p></div>
    </div>
  </div>
  <footer>📍 Near Railway Station, Aurangabad | 📞 7276524259 | Open 7AM - 10PM</footer>
</body>
</html>
