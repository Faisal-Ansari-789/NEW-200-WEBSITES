<!DOCTYPE html>
<html>
<head>
  <title>My Favourite Foods</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8f0; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #c0392b; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 800px; margin: auto; }
    .card { background: white; border: 1px solid #f0d9c8; border-radius: 8px; padding: 20px; text-align: center; }
    .card h2 { font-size: 40px; }
    .card p { color: #555; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🍽️ My Favourite Foods</h1>
  <div class="grid">
    <div class="card"><h2>🍛</h2><p>Biryani</p></div>
    <div class="card"><h2>🍕</h2><p>Pizza</p></div>
    <div class="card"><h2>🍔</h2><p>Naan Khaliya</p></div>
    <div class="card"><h2>🥘</h2><p>Nihari</p></div>
    <div class="card"><h2>🧆</h2><p>Samosa</p></div>
    <div class="card"><h2>🍜</h2><p>Maggi</p></div>
  </div>
</body>
</html>
