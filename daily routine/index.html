<!DOCTYPE html>
<html>
<head>
  <title>My Daily Routine</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; }
    h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
    .item { display: flex; gap: 20px; align-items: center; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px 20px; margin-bottom: 12px; }
    .time { font-weight: bold; color: #2c3e50; min-width: 80px; }
    .task { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Daily Routine</h1>
    <div class="item"><div class="time">6:00 AM</div><div class="task">Wake up & Freshen up</div></div>
    <div class="item"><div class="time">7:00 AM</div><div class="task">Morning walk / Exercise</div></div>
    <div class="item"><div class="time">8:00 AM</div><div class="task">Breakfast</div></div>
    <div class="item"><div class="time">9:00 AM</div><div class="task">College / Classes</div></div>
    <div class="item"><div class="time">2:00 PM</div><div class="task">Lunch & Rest</div></div>
    <div class="item"><div class="time">4:00 PM</div><div class="task">Self Study / Coding</div></div>
    <div class="item"><div class="time">7:00 PM</div><div class="task">Dinner with family</div></div>
    <div class="item"><div class="time">9:00 PM</div><div class="task">Revision & Reading</div></div>
    <div class="item"><div class="time">11:00 PM</div><div class="task">Sleep</div></div>
  </div>
</body>
</html>
