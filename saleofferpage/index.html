<!DOCTYPE html>
<html>
<head>
  <title>Big Sale!</title>
  <style>
    body { font-family: Arial, sans-serif; background: #c0392b; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 16px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
    .badge { background: #c0392b; color: white; font-size: 12px; font-weight: bold; letter-spacing: 2px; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
    h1 { font-size: 60px; color: #c0392b; line-height: 1; margin-bottom: 5px; }
    h2 { font-size: 22px; color: #2c3e50; margin-bottom: 15px; }
    p { font-size: 14px; color: #555; line-height: 1.8; margin-bottom: 20px; }
    .items { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
    .item { background: #fde8e8; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #c0392b; font-weight: bold; }
    .btn { display: inline-block; background: #c0392b; color: white; padding: 14px 36px; border-radius: 6px; text-decoration: none; font-size: 15px; font-weight: bold; }
    .timer { font-size: 12px; color: #aaa; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🔥 LIMITED TIME OFFER</div>
    <h1>50%</h1>
    <h2>OFF Everything!</h2>
    <p>Don't miss out on our biggest sale of the year. Grab your favourites before the offer ends!</p>
    <div class="items">
      <div class="item">👕 Clothing</div>
      <div class="item">👟 Footwear</div>
      <div class="item">📱 Electronics</div>
      <div class="item">📚 Books</div>
    </div>
    <a href="#" class="btn">Shop Now →</a>
    <p class="timer">⏰ Offer ends in: 2 Days 14 Hours 32 Mins</p>
  </div>
</body>
</html>
