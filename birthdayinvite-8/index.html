<!DOCTYPE html>
<html>
<head>
  <title>Birthday Invitation</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff0f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border: 3px solid #e91e8c; border-radius: 16px; padding: 40px; max-width: 450px; width: 100%; text-align: center; }
    .emoji { font-size: 55px; margin-bottom: 10px; }
    .top { font-size: 13px; color: #aaa; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    h1 { color: #e91e8c; font-size: 30px; margin-bottom: 5px; }
    .name { font-size: 22px; color: #2c3e50; font-weight: bold; margin-bottom: 20px; }
    .detail { background: #fff0f8; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 14px; color: #555; }
    .detail strong { color: #e91e8c; }
    .btn { display: inline-block; background: #e91e8c; color: white; padding: 12px 28px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; margin-top: 15px; }
    .note { font-size: 12px; color: #aaa; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎂🎉🎈</div>
    <div class="top">You are invited to</div>
    <h1>Birthday Party!</h1>
    <div class="name">Faisal's 21st Birthday 🥳</div>
    <div class="detail"><strong>📅 Date:</strong> Sunday, August 3, 2026</div>
    <div class="detail"><strong>⏰ Time:</strong> 6:00 PM - 10:00 PM</div>
    <div class="detail"><strong>📍 Venue:</strong> Sadat Nagar, Aurangabad</div>
    <div class="detail"><strong>🎁 Theme:</strong> Casual & Fun!</div>
    <a href="#" class="btn">I'll Be There! 🎉</a>
    <p class="note">Please confirm by July 28, 2026</p>
  </div>
</body>
</html>
