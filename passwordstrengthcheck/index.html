<!DOCTYPE html>
<html>
<head>
  <title>Password Strength Checker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 30px; max-width: 420px; width: 100%; }
    h1 { color: #2c3e50; font-size: 20px; margin-bottom: 6px; }
    p { font-size: 13px; color: #777; margin-bottom: 20px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 20px; }
    .rule { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #555; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
    .pass .dot { background: #27ae60; }
    .pass { color: #27ae60; }
    .strength { margin-top: 15px; font-size: 13px; color: #777; }
    .bar { height: 6px; background: #ddd; border-radius: 10px; margin-top: 6px; }
    .fill { height: 100%; width: 40%; background: #f39c12; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 Password Checker</h1>
    <p>Type a password to check how strong it is</p>
    <input type="password" placeholder="Enter your password..." />
    <div class="rule pass"><div class="dot"></div> At least 8 characters</div>
    <div class="rule"><div class="dot"></div> Contains uppercase letter (A-Z)</div>
    <div class="rule pass"><div class="dot"></div> Contains lowercase letter (a-z)</div>
    <div class="rule"><div class="dot"></div> Contains a number (0-9)</div>
    <div class="rule"><div class="dot"></div> Contains special character (!@#$)</div>
    <div class="strength">
      Password Strength: <strong style="color:#f39c12">Medium</strong>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>
</body>
</html>
