<!DOCTYPE html>
<html>
<head>
  <title>Joke of the Day</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff9e6; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    h1 { color: #f39c12; font-size: 28px; margin-bottom: 30px; }
    .card { background: white; border: 2px solid #f39c12; border-radius: 12px; padding: 30px; max-width: 500px; width: 100%; text-align: center; margin-bottom: 20px; }
    .emoji { font-size: 50px; margin-bottom: 15px; }
    .question { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 20px; }
    .answer { font-size: 15px; color: #e74c3c; font-weight: bold; border-top: 1px dashed #ddd; padding-top: 15px; }
    .next { background: #f39c12; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>😂 Joke of the Day</h1>
  <div class="card">
    <div class="emoji">🤣</div>
    <div class="question">Why don't scientists trust atoms?</div>
    <div class="answer">Because they make up everything! 😄</div>
  </div>
  <div class="card">
    <div class="emoji">😅</div>
    <div class="question">Why did the computer go to the doctor?</div>
    <div class="answer">Because it had a virus! 💻🤒</div>
  </div>
  <div class="card">
    <div class="emoji">😂</div>
    <div class="question">What do you call a fake noodle?</div>
    <div class="answer">An impasta! 🍝</div>
  </div>
</body>
</html>
