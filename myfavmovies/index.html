<!DOCTYPE html>
<html>
<head>
  <title>My Favourite Movies</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #e0e0e0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 800px; margin: auto; }
    .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 20px; text-align: center; }
    .card h2 { font-size: 16px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #aaa; }
    .star { color: gold; }
  </style>
</head>
<body>
  <h1>🎬 My Favourite Movies</h1>
  <div class="grid">
    <div class="card"><h2>Interstellar</h2><p>Sci-Fi / Space</p><p class="star">★★★★★</p></div>
    <div class="card"><h2>3 Idiots</h2><p>Comedy / Drama</p><p class="star">★★★★★</p></div>
    <div class="card"><h2>Inception</h2><p>Sci-Fi / Thriller</p><p class="star">★★★★★</p></div>
    <div class="card"><h2>KGF Chapter 2</h2><p>Action / Drama</p><p class="star">★★★★☆</p></div>
    <div class="card"><h2>Pushpa</h2><p>Action / Thriller</p><p class="star">★★★★☆</p></div>
    <div class="card"><h2>RRR</h2><p>Action / Historical</p><p class="star">★★★★★</p></div>
  </div>
</body>
</html>
