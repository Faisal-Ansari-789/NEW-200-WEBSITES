<!DOCTYPE html>
<html>
<head>
  <title>Unit Converter</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 30px; max-width: 420px; width: 100%; }
    h1 { color: #2c3e50; font-size: 20px; margin-bottom: 20px; text-align: center; }
    h2 { color: #2c3e50; font-size: 15px; border-bottom: 2px solid #2c3e50; padding-bottom: 5px; margin-top: 20px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #444; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .row span:last-child { font-weight: bold; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📐 Unit Converter</h1>
    <h2>Length</h2>
    <div class="row"><span>1 Kilometer</span><span>= 1000 Meters</span></div>
    <div class="row"><span>1 Meter</span><span>= 100 Centimeters</span></div>
    <div class="row"><span>1 Mile</span><span>= 1.609 Kilometers</span></div>
    <div class="row"><span>1 Foot</span><span>= 30.48 Centimeters</span></div>
    <div class="row"><span>1 Inch</span><span>= 2.54 Centimeters</span></div>
    <h2>Weight</h2>
    <div class="row"><span>1 Kilogram</span><span>= 1000 Grams</span></div>
    <div class="row"><span>1 Pound</span><span>= 453.59 Grams</span></div>
    <div class="row"><span>1 Ton</span><span>= 1000 Kilograms</span></div>
    <h2>Temperature</h2>
    <div class="row"><span>0°C</span><span>= 32°F</span></div>
    <div class="row"><span>100°C</span><span>= 212°F</span></div>
    <div class="row"><span>37°C (Body)</span><span>= 98.6°F</span></div>
  </div>
</body>
</html>
