<!DOCTYPE html>
<html>
<head>
  <title>BMI Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f8ff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border: 1px solid #d0e8ff; border-radius: 10px; padding: 30px; max-width: 400px; width: 100%; }
    h1 { color: #1a73e8; font-size: 20px; margin-bottom: 6px; }
    p { font-size: 13px; color: #777; margin-bottom: 20px; }
    label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; text-transform: uppercase; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 16px; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .result { margin-top: 20px; background: #e8f4fd; border-radius: 8px; padding: 16px; text-align: center; }
    .result h2 { color: #1a73e8; font-size: 32px; margin-bottom: 4px; }
    .result p { color: #27ae60; font-weight: bold; margin: 0; }
    .chart { margin-top: 15px; font-size: 12px; color: #555; }
    .chart div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚖️ BMI Calculator</h1>
    <p>Calculate your Body Mass Index</p>
    <label>Height (cm)</label>
    <input type="number" placeholder="e.g. 170" value="170" />
    <label>Weight (kg)</label>
    <input type="number" placeholder="e.g. 65" value="65" />
    <button>Calculate BMI</button>
    <div class="result">
      <h2>22.5</h2>
      <p>✅ Normal Weight</p>
    </div>
    <div class="chart">
      <div><span>Underweight</span><span>Below 18.5</span></div>
      <div><span>Normal</span><span>18.5 - 24.9</span></div>
      <div><span>Overweight</span><span>25 - 29.9</span></div>
      <div><span>Obese</span><span>30 and above</span></div>
    </div>
  </div>
</body>
</html>
