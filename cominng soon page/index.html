<!DOCTYPE html>
<html>
<head>
  <title>Coming Soon</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
    .container { max-width: 500px; }
    h1 { font-size: 48px; margin-bottom: 10px; }
    h2 { font-size: 24px; color: #00d4ff; margin-bottom: 15px; }
    p { color: #aaa; font-size: 14px; line-height: 1.8; margin-bottom: 30px; }
    .countdown { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
    .box { background: #16213e; border: 1px solid #00d4ff; border-radius: 8px; padding: 16px 20px; }
    .box h3 { font-size: 28px; color: #00d4ff; margin-bottom: 4px; }
    .box p { font-size: 11px; color: #aaa; margin: 0; }
    input { padding: 10px 16px; border: 1px solid #00d4ff; background: transparent; color: white; border-radius: 6px 0 0 6px; font-size: 13px; outline: none; }
    button { padding: 10px 16px; background: #00d4ff; color: #0a0a2e; border: none; border-radius: 0 6px 6px 0; font-size: 13px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀</h1>
    <h2>Something Amazing is Coming!</h2>
    <p>We are working hard to bring you something incredible. Stay tuned and be the first to know when we launch!</p>
    <div class="countdown">
      <div class="box"><h3>12</h3><p>Days</p></div>
      <div class="box"><h3>08</h3><p>Hours</p></div>
      <div class="box"><h3>45</h3><p>Mins</p></div>
      <div class="box"><h3>30</h3><p>Secs</p></div>
    </div>
    <div>
      <input type="email" placeholder="Enter your email" />
      <button>Notify Me</button>
    </div>
  </div>
</body>
</html>
