<!DOCTYPE html>
<html>
<head>
  <title>Event Invitation</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a0a2e; color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #2a1a3e; border: 2px solid #9b59b6; border-radius: 16px; padding: 40px; max-width: 500px; width: 100%; text-align: center; }
    .emoji { font-size: 50px; margin-bottom: 15px; }
    h1 { color: #9b59b6; font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #aaa; font-size: 14px; margin-bottom: 25px; }
    .detail { background: #1a0a2e; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .detail span:first-child { font-size: 13px; color: #aaa; }
    .detail span:last-child { font-size: 14px; font-weight: bold; color: white; }
    .btn { display: inline-block; background: #9b59b6; color: white; padding: 12px 30px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; margin-top: 20px; }
    .note { font-size: 12px; color: #777; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>You're Invited!</h1>
    <p class="subtitle">Join us for an amazing evening of celebration</p>
    <div class="detail"><span>📅 Date</span><span>Saturday, June 15, 2026</span></div>
    <div class="detail"><span>⏰ Time</span><span>7:00 PM onwards</span></div>
    <div class="detail"><span>📍 Venue</span><span>MIT College, Aurangabad</span></div>
    <div class="detail"><span>👔 Dress Code</span><span>Formal / Semi-Formal</span></div>
    <a href="#" class="btn">RSVP Now</a>
    <p class="note">Kindly confirm your attendance by June 10, 2026</p>
  </div>
</body>
</html>
