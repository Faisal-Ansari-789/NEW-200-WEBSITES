<!DOCTYPE html>
<html>
<head>
  <title>404 - Page Not Found</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
    .container { max-width: 500px; }
    h1 { font-size: 100px; color: #2c3e50; margin: 0; line-height: 1; }
    h2 { font-size: 22px; color: #555; margin: 10px 0; }
    p { color: #777; font-size: 14px; margin-bottom: 25px; }
    a { display: inline-block; background: #2c3e50; color: white; padding: 10px 24px; border-radius: 6px; text-decoration: none; font-size: 14px; }
    a:hover { background: #1a252f; }
    .emoji { font-size: 60px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">😕</div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Oops! The page you are looking for does not exist. It might have been moved or deleted.</p>
    <a href="index.html">← Go Back Home</a>
  </div>
</body>
</html>
