<!DOCTYPE html>
<html>
<head>
  <title>Royal Cuts Barber Shop</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 0; }
    header { background: #b8960c; text-align: center; padding: 30px 20px; }
    header h1 { font-size: 30px; color: #1a1a1a; }
    header p { font-size: 13px; color: #333; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
    h2 { color: #b8960c; border-bottom: 2px solid #b8960c; padding-bottom: 6px; margin-bottom: 20px; }
    .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; font-size: 14px; }
    .price { color: #b8960c; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
    .card { background: #2a2a2a; border: 1px solid #b8960c; border-radius: 8px; padding: 16px; text-align: center; }
    .card h3 { font-size: 30px; }
    .card p { font-size: 13px; color: #aaa; }
    footer { background: #b8960c; color: #1a1a1a; text-align: center; padding: 15px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>✂️ Royal Cuts Barber Shop</h1>
    <p>Look Sharp. Feel Fresh. Every Day.</p>
  </header>
  <div class="container">
    <h2>Our Services</h2>
    <div class="item"><span>Haircut</span><span class="price">₹100</span></div>
    <div class="item"><span>Beard Trim</span><span class="price">₹60</span></div>
    <div class="item"><span>Haircut + Beard</span><span class="price">₹150</span></div>
    <div class="item"><span>Head Massage</span><span class="price">₹80</span></div>
    <div class="item"><span>Facial</span><span class="price">₹200</span></div>
    <div class="item"><span>Hair Colour</span><span class="price">₹300</span></div>
    <h2>Why Choose Us</h2>
    <div class="grid">
      <div class="card"><h3>⏰</h3><p>Open 9AM - 9PM</p></div>
      <div class="card"><h3>💈</h3><p>10+ Years Experience</p></div>
      <div class="card"><h3>😊</h3><p>100% Satisfaction</p></div>
    </div>
  </div>
  <footer>📍 Near Railway Station, Aurangabad | 📞 7276524259</footer>
</body>
</html>
